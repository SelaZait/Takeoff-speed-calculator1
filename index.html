<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Takeoff Speed Calculator</title>
    <style>
        :root {
            --primary-color: #007aff;
            --background-color: #f2f2f7;
            --card-background: #ffffff;
            --text-color: #1c1c1e;
            --subtext-color: #8e8e93;
            --danger-color: #ff3b30;
            --warning-color: #ff9500;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .card {
            background-color: var(--card-background);
            padding: 28px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 440px;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 24px;
            text-align: center;
            font-weight: 700;
        }

        .input-group {
            margin-bottom: 18px;
        }

        .wind-group, .heading-group {
            display: flex;
            gap: 10px;
        }

        .wind-group .input-wrapper { flex: 2; }
        .wind-group .select-wrapper { flex: 1; }
        .heading-group .input-wrapper { flex: 1; }

        .input-with-btn {
            display: flex;
            gap: 6px;
        }

        .input-with-btn input {
            flex: 1;
        }

        .compass-btn {
            width: 44px;
            height: 48px;
            padding: 0;
            margin-top: 0;
            background-color: #e5e5ea;
            color: var(--primary-color);
            font-size: 18px;
            border: none;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            cursor: pointer;
            user-select: none;
        }

        .compass-btn:active {
            background-color: #c7c7cc;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 600;
            color: var(--subtext-color);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="number"], select {
            width: 100%;
            padding: 14px;
            border: 1px solid #c7c7cc;
            border-radius: 12px;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
            background-color: #fff;
            transition: border-color 0.2s;
        }

        input[type="number"]:focus, select:focus {
            border-color: var(--primary-color);
        }

        .toggle-wrapper {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #f8f8fc;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid #e5e5ea;
            margin-bottom: 18px;
        }

        .toggle-wrapper label {
            margin-bottom: 0;
            cursor: pointer;
            color: var(--text-color);
            font-size: 14px;
            text-transform: none;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 46px;
            height: 26px;
        }

        .switch input { opacity: 0; width: 0; height: 0; }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #e5e5ea;
            transition: .3s;
            border-radius: 26px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 20px;
            width: 20px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked + .slider { background-color: var(--primary-color); }
        input:checked + .slider:before { transform: translateX(20px); }

        button.primary-btn {
            width: 100%;
            padding: 16px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s;
        }

        button.primary-btn:active { background-color: #0056b3; }

        .ai-btn {
            background-color: #e5e5ea;
            color: #007aff;
            margin-top: 0;
            margin-bottom: 12px;
            font-size: 15px;
            padding: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border: none;
            border-radius: 12px;
            width: 100%;
            cursor: pointer;
            font-weight: 600;
        }

        .canvas-container {
            position: relative;
            text-align: center;
            margin-bottom: 12px;
            display: none;
        }

        canvas {
            max-width: 100%;
            border-radius: 10px;
            border: 1px solid #c7c7cc;
            touch-action: none;
            cursor: crosshair;
        }

        .canvas-hint {
            font-size: 12px;
            color: var(--subtext-color);
            margin-top: 6px;
        }

        .result-container {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid #e5e5ea;
            text-align: center;
        }

        .result-label {
            font-size: 13px;
            color: var(--subtext-color);
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        .result-value {
            font-size: 38px;
            font-weight: 800;
            color: var(--primary-color);
        }

        .result-details {
            font-size: 15px;
            color: var(--subtext-color);
            margin-top: 8px;
            font-weight: 500;
        }

        .warning-box {
            margin-top: 14px;
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            display: none;
            text-align: center;
        }

        .warning-box.danger {
            background-color: #ffe5e5;
            color: var(--danger-color);
            border: 1px solid var(--danger-color);
        }

        .warning-box.warning {
            background-color: #fff3e0;
            color: var(--warning-color);
            border: 1px solid var(--warning-color);
        }

        .wing-note {
            width: 100%;
            max-width: 440px;
            margin-top: 14px;
            text-align: center;
            font-size: 12px;
            color: var(--subtext-color);
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Takeoff Calculator</h2>

    <div class="input-group">
        <label for="weight">Takeoff Weight (kg) - Integer Only</label>
        <input type="number" id="weight" placeholder="e.g. 500" step="1" min="1" oninput="validateIntegerWeight(this)">
    </div>

    <div class="input-group">
        <label for="elevation">Site Elevation (m ASL)</label>
        <div class="input-with-btn">
            <input type="number" id="elevation" placeholder="e.g. 800" step="any" value="0">
            <button type="button" class="compass-btn" id="btnGPS" title="Capture Elevation from GPS">📍</button>
        </div>
    </div>

    <!-- Toggle AI Engine -->
    <div class="toggle-wrapper">
        <label for="aiToggle">Enable Windsock Photo Measurement</label>
        <label class="switch">
            <input type="checkbox" id="aiToggle">
            <span class="slider"></span>
        </label>
    </div>

    <!-- Image Upload & Interactive Canvas Area -->
    <div class="input-group" id="aiSection" style="display: none;">
        <input type="file" id="aiImageInput" accept="image/*" style="display: none;">
        <button id="aiBtn" type="button" class="ai-btn">
            🖼️ Select Photo / Take Picture
        </button>
        <div class="canvas-container" id="canvasContainer">
            <canvas id="windsockCanvas"></canvas>
            <div class="canvas-hint">Draw a line from the base of the sock to its tip</div>
        </div>
    </div>

    <div class="input-group wind-group">
        <div class="input-wrapper">
            <label for="windSpeed">Wind Speed</label>
            <input type="number" id="windSpeed" placeholder="0" step="any" min="0" value="0" oninput="this.value = clampPositive(this.value)">
        </div>
        <div class="select-wrapper">
            <label for="windUnit">Unit</label>
            <select id="windUnit">
                <option value="kts" selected>Knots (kts)</option>
                <option value="kmh">km/h</option>
                <option value="ms">m/s</option>
            </select>
        </div>
    </div>

    <!-- Heading & Wind Dir Input Fields -->
    <div class="heading-group input-group">
        <div class="input-wrapper">
            <label for="takeoffHeading">Takeoff Hdg (°)</label>
            <div class="input-with-btn">
                <input type="number" id="takeoffHeading" placeholder="0-360" min="0" max="360" value="0" oninput="this.value = clampAzimuth(this.value)">
                <button type="button" class="compass-btn" id="btnHdgCompass" title="Capture Heading">🧭</button>
            </div>
        </div>
        <div class="input-wrapper">
            <label for="windDir">Wind Dir (°)</label>
            <div class="input-with-btn">
                <input type="number" id="windDir" placeholder="0-360" min="0" max="360" value="0" oninput="this.value = clampAzimuth(this.value)">
                <button type="button" class="compass-btn" id="btnWindCompass" title="Capture Wind Direction">🧭</button>
            </div>
        </div>
    </div>

    <button type="button" class="primary-btn" id="btnCalculate">Calculate Speed</button>

    <!-- Safety Warning Box -->
    <div class="warning-box" id="warningBox"></div>

    <div class="result-container" id="resultContainer" style="display: none;">
        <div class="result-label">Ground Speed Required</div>
        <div class="result-value" id="groundspeedResult">0 km/h</div>

        <div class="result-details" id="headwindResult">Headwind Component: 0 km/h</div>
        <div class="result-details" id="crosswindResult">Crosswind Component: 0 kts</div>
        <div class="result-details" id="airspeedResult">Airspeed (TAS): 0 km/h</div>
    </div>
</div>

<div class="wing-note">Calibrated specifically for the APCO Cruiser S 550 wing.</div>

<script>
    let currentImageUrl = null;
    let loadedImage = null;

    // Attach Event Listeners on DOM Loaded
    document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('btnGPS').addEventListener('click', captureElevation);
        document.getElementById('btnHdgCompass').addEventListener('click', (e) => captureCompass('takeoffHeading', e));
        document.getElementById('btnWindCompass').addEventListener('click', (e) => captureCompass('windDir', e));
        document.getElementById('btnCalculate').addEventListener('click', calculateSpeed);
        
        document.getElementById('aiToggle').addEventListener('change', (e) => {
            document.getElementById('aiSection').style.display = e.target.checked ? 'block' : 'none';
        });

        const aiBtn = document.getElementById('aiBtn');
        const aiFileInput = document.getElementById('aiImageInput');

        aiBtn.addEventListener('click', () => aiFileInput.click());
        aiFileInput.addEventListener('change', handleWindsockImage);
    });

    /* =========================================================
       1. INPUT VALIDATION (Integer Weight & Clamping)
       ========================================================= */
    function validateIntegerWeight(input) {
        let val = input.value;
        if (val === '') return;
        let num = parseInt(val, 10);
        if (isNaN(num) || num <= 0) {
            input.value = '';
        } else {
            input.value = num;
        }
    }

    function clampAzimuth(value) {
        if (value === '' || value === null) return value;
        let num = parseFloat(value);
        if (isNaN(num)) return '';
        if (num < 0) num = 0;
        if (num > 360) num = 360;
        return num;
    }

    function clampPositive(value) {
        if (value === '' || value === null) return value;
        let num = parseFloat(value);
        if (isNaN(num)) return '';
        if (num < 0) num = 0;
        return num;
    }

    /* =========================================================
       2. COMPASS CAPTURE (iOS + Android, Portrait + Landscape)
       ========================================================= */
    function getScreenOrientationAngle() {
        if (screen.orientation && screen.orientation.angle !== undefined) {
            return screen.orientation.angle;
        }
        if (typeof window.orientation !== 'undefined') {
            return window.orientation;
        }
        return 0;
    }

    async function captureCompass(targetInputId, evt) {
        const btn = evt.currentTarget;
        const originalText = btn.innerText;
        btn.innerText = "⏳";

        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
            try {
                const response = await DeviceOrientationEvent.requestPermission();
                if (response === 'granted') {
                    listenToOrientation(targetInputId, btn, originalText);
                } else {
                    alert("Compass permission was denied.");
                    btn.innerText = originalText;
                }
            } catch (error) {
                alert("HTTPS connection required for compass sensor.");
                btn.innerText = originalText;
            }
        } else if ('ondeviceorientationabsolute' in window || 'ondeviceorientation' in window) {
            listenToOrientation(targetInputId, btn, originalText);
        } else {
            alert("Compass sensor is not supported on this device/browser.");
            btn.innerText = originalText;
        }
    }

    function listenToOrientation(targetInputId, btn, originalText) {
        let captured = false;

        function handleEvent(event) {
            if (captured) return;

            let heading = null;

            if (event.webkitCompassHeading !== undefined && event.webkitCompassHeading !== null) {
                heading = event.webkitCompassHeading;
            } else if (event.alpha !== undefined && event.alpha !== null) {
                if (event.absolute || event.type === 'deviceorientationabsolute') {
                    heading = (360 - event.alpha) % 360;
                }
            }

            if (heading !== null && !isNaN(heading)) {
                captured = true;
                
                const screenAngle = getScreenOrientationAngle();
                let finalHeading = (heading + screenAngle) % 360;
                if (finalHeading < 0) finalHeading += 360;

                const normalizedHeading = Math.round(finalHeading);
                document.getElementById(targetInputId).value = normalizedHeading;

                cleanListeners(handleEvent);
                btn.innerText = "✅";
                setTimeout(() => { btn.innerText = originalText; }, 1200);
            }
        }

        if ('ondeviceorientationabsolute' in window) {
            window.addEventListener('deviceorientationabsolute', handleEvent, true);
        }
        window.addEventListener('deviceorientation', handleEvent, true);

        setTimeout(() => {
            if (!captured) {
                cleanListeners(handleEvent);
                btn.innerText = originalText;
                alert("No compass signal detected. Ensure motion sensors are enabled.");
            }
        }, 3000);
    }

    function cleanListeners(handler) {
        window.removeEventListener('deviceorientationabsolute', handler, true);
        window.removeEventListener('deviceorientation', handler, true);
    }

    /* =========================================================
       3. GPS ELEVATION CAPTURE
       ========================================================= */
    function captureElevation(evt) {
        const btn = evt.currentTarget;
        const originalText = btn.innerText;

        if (!('geolocation' in navigator)) {
            alert("Geolocation is not supported on this device.");
            return;
        }

        btn.innerText = "⏳";

        navigator.geolocation.getCurrentPosition(
            (position) => {
                const altitude = position.coords.altitude;
                if (altitude === null || altitude === undefined) {
                    alert("Device did not return altitude data. Please enter elevation manually.");
                    btn.innerText = originalText;
                    return;
                }
                document.getElementById('elevation').value = Math.round(altitude);
                btn.innerText = "✅";
                setTimeout(() => { btn.innerText = originalText; }, 1200);
            },
            () => {
                alert("Could not obtain GPS altitude fix.");
                btn.innerText = originalText;
            },
            { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
        );
    }

    /* =========================================================
       4. SPEED CALCULATIONS & SAFETY WARNINGS
       ========================================================= */
    function airDensityRatio(altitudeM) {
        const sigma = Math.pow(1 - 2.25577e-5 * altitudeM, 4.2559);
        return Math.max(0.01, sigma);
    }

    function calculateSpeed() {
        const weightInput = document.getElementById('weight').value;
        const weight = parseInt(weightInput, 10);
        
        if (isNaN(weight) || weight <= 0 || !Number.isInteger(weight)) {
            alert("Please enter a valid positive integer weight in kg.");
            return;
        }

        const elevationInput = parseFloat(document.getElementById('elevation').value);
        const elevation = isNaN(elevationInput) ? 0 : elevationInput;
        const windSpeedInput = parseFloat(document.getElementById('windSpeed').value) || 0;
        const windUnit = document.getElementById('windUnit').value;

        const windDir = parseFloat(document.getElementById('windDir').value) || 0;
        const takeoffHeading = parseFloat(document.getElementById('takeoffHeading').value) || 0;

        let windKkts = windSpeedInput;
        if (windUnit === 'kmh') windKkts = windSpeedInput / 1.852;
        else if (windUnit === 'ms') windKkts = windSpeedInput * 1.94384;

        const windKmh = windKkts * 1.852;
        const angleDiffRad = (windDir - takeoffHeading) * (Math.PI / 180);
        
        const headwindKmh = windKmh * Math.cos(angleDiffRad);
        const crosswindKkts = Math.abs(windKkts * Math.sin(angleDiffRad));

        // APCO Cruiser S 550 Calibration
        const K_mid = 70.1 / Math.sqrt(490);
        const airspeedKmhSeaLevel = K_mid * Math.sqrt(weight);

        const sigma = airDensityRatio(elevation);
        const airspeedKmh = airspeedKmhSeaLevel / Math.sqrt(sigma);
        const airspeedMs = airspeedKmh / 3.6;

        const groundSpeedKmh = Math.max(0, airspeedKmh - headwindKmh);

        document.getElementById('groundspeedResult').innerText = groundSpeedKmh.toFixed(1) + ' km/h';
        document.getElementById('headwindResult').innerText = `Headwind Component: ${headwindKmh.toFixed(1)} km/h`;
        document.getElementById('crosswindResult').innerText = `Crosswind Component: ${crosswindKkts.toFixed(1)} kts`;
        document.getElementById('airspeedResult').innerText = `Airspeed (TAS) @ ${elevation.toFixed(0)}m: ${airspeedKmh.toFixed(1)} km/h | ${airspeedMs.toFixed(1)} m/s`;

        // Safety Warnings
        const warningBox = document.getElementById('warningBox');
        warningBox.style.display = 'none';
        warningBox.className = 'warning-box';

        if (headwindKmh < 0) {
            warningBox.style.display = 'block';
            warningBox.classList.add('danger');
            warningBox.innerHTML = `⚠️ TAILWIND WARNING (${Math.abs(headwindKmh).toFixed(1)} km/h)! Taking off with tailwind is extremely hazardous.`;
        } else if (crosswindKkts > 5) {
            warningBox.style.display = 'block';
            warningBox.classList.add('warning');
            warningBox.innerHTML = `⚠️ CROSSWIND WARNING: High crosswind component (${crosswindKkts.toFixed(1)} kts > 5 kts)!`;
        }

        document.getElementById('resultContainer').style.display = 'block';
    }

    /* =========================================================
       5. WINDSOCK CANVAS INTERACTION & MEMORY CLEANUP
       ========================================================= */
    let isDrawing = false;
    let startX = 0, startY = 0;

    function handleWindsockImage(event) {
        const file = event.target.files[0];
        if (!file) return;

        // Prevent Memory Leak: Revoke old Blob URL
        if (currentImageUrl) {
            URL.revokeObjectURL(currentImageUrl);
        }

        currentImageUrl = URL.createObjectURL(file);
        const canvasContainer = document.getElementById('canvasContainer');
        const canvas = document.getElementById('windsockCanvas');
        const ctx = canvas.getContext('2d');

        loadedImage = new Image();
        loadedImage.onload = () => {
            const maxWidth = 380;
            const scale = maxWidth / loadedImage.width;
            canvas.width = maxWidth;
            canvas.height = loadedImage.height * scale;

            ctx.drawImage(loadedImage, 0, 0, canvas.width, canvas.height);
            canvasContainer.style.display = 'block';
            setupCanvasInteraction(canvas, ctx);
        };
        loadedImage.src = currentImageUrl;
    }

    function setupCanvasInteraction(canvas, ctx) {
        function getCoords(e) {
            const rect = canvas.getBoundingClientRect();
            let clientX, clientY;

            if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }

            return {
                x: clientX - rect.left,
                y: clientY - rect.top
            };
        }

        function startLine(e) {
            isDrawing = true;
            const coords = getCoords(e);
            startX = coords.x;
            startY = coords.y;
        }

        function drawLine(e) {
            if (!isDrawing) return;
            e.preventDefault();
            const coords = getCoords(e);

            ctx.drawImage(loadedImage, 0, 0, canvas.width, canvas.height);
            ctx.beginPath();
            ctx.moveTo(startX, startY);
            ctx.lineTo(coords.x, coords.y);
            ctx.strokeStyle = '#ff3b30';
            ctx.lineWidth = 3;
            ctx.stroke();
        }

        function endLine(e) {
            if (!isDrawing) return;
            isDrawing = false;

            let endX, endY;
            if (e.changedTouches && e.changedTouches.length > 0) {
                const rect = canvas.getBoundingClientRect();
                endX = e.changedTouches[0].clientX - rect.left;
                endY = e.changedTouches[0].clientY - rect.top;
            } else {
                const coords = getCoords(e);
                endX = coords.x;
                endY = coords.y;
            }

            calculateWindFromLine(startX, startY, endX, endY);
        }

        // Mouse Events
        canvas.onmousedown = startLine;
        canvas.onmousemove = drawLine;
        canvas.onmouseup = endLine;

        // Touch Events
        canvas.ontouchstart = startLine;
        canvas.ontouchmove = drawLine;
        canvas.ontouchend = endLine;
    }

    function calculateWindFromLine(x1, y1, x2, y2) {
        const dx = Math.abs(x2 - x1);
        const dy = Math.abs(y2 - y1);

        const angleRad = Math.atan2(dy, dx);
        const angleDeg = angleRad * (180 / Math.PI);

        // Aerodynamic Drag Equilibrium Model: V = V_max * sqrt(cos(theta))
        const FULL_EXTENSION_KTS = 15;
        const estimatedKnots = FULL_EXTENSION_KTS * Math.sqrt(Math.cos(angleRad));

        document.getElementById('windSpeed').value = estimatedKnots.toFixed(1);
        document.getElementById('windUnit').value = 'kts';

        const btn = document.getElementById('aiBtn');
        btn.innerText = `✅ Angle: ${angleDeg.toFixed(0)}° → ~${estimatedKnots.toFixed(1)} kts`;
    }
</script>

</body>
</html>
